name: iam-lab
networks:
  lab: {}
volumes:
  ldap_data: {}
  ldap_config: {}
  pg_data: {}
  gitea_data: {}
  grafana_data: {}
  nextcloud_data: {}
services:
  caddy:
    image: caddy:2.8
    ports: ["127.0.0.1:443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      lab:
        aliases: [sso.acmefin.test, git.acmefin.test, grafana.acmefin.test, cloud.acmefin.test, api.acmefin.test, vault.acmefin.test]
  whoami:
    image: traefik/whoami
    networks: [lab]
  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: AcmeFin
      LDAP_DOMAIN: acmefin.test
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_PASSWORD}
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    ports: ["127.0.0.1:389:389"]
    networks: [lab]
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    depends_on: [openldap]
    networks: [lab]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [lab]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://sso.acmefin.test
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    depends_on: [postgres, openldap]
    networks: [lab]
  gitea:
    image: gitea/gitea:1.22
    environment:
      SSL_CERT_FILE: /certs/rootCA.pem
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: git.acmefin.test
      GITEA__server__ROOT_URL: https://git.acmefin.test/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: email
      GITEA__oauth2_client__ACCOUNT_LINKING: disabled
    volumes:
      - gitea_data:/data
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on: [keycloak]
    networks: [lab]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SERVER_ROOT_URL: https://grafana.acmefin.test
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: AcmeFin SSO
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://sso.acmefin.test/realms/acmefin/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://sso.acmefin.test/realms/acmefin/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://sso.acmefin.test/realms/acmefin/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA: /certs/rootCA.pem
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'it-admin') && 'Admin' || contains(roles[*], 'it-support') && 'Editor' || (contains(roles[*], 'dev') || contains(roles[*], 'dev-lead')) && 'Viewer' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    networks: [lab]
  nextcloud:
    image: nextcloud:30-apache
    environment:
      SQLITE_DATABASE: nextcloud                       # base SQLite, suffisante pour le lab
      NEXTCLOUD_ADMIN_USER: nc-secours                 # compte local de secours
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.acmefin.test
      OVERWRITEHOST: cloud.acmefin.test
      OVERWRITEPROTOCOL: https                         # Nextcloud génère ses adresses en https
      OVERWRITECLIURL: https://cloud.acmefin.test
      TRUSTED_PROXIES: 172.16.0.0/12                   # il fait confiance aux en-têtes de Caddy
    volumes: [nextcloud_data:/var/www/html]
    networks: [lab]
  api:
    build: ./apps/api
    environment:
      SSL_CERT_FILE: /certs/rootCA.pem          # pour télécharger les clés de Keycloak en HTTPS
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    networks: [lab]
  openbao:
    image: quay.io/openbao/openbao:2.1.0
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=${BAO_ROOT_TOKEN}"]
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8250:8250"]
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    networks: [lab]
  srv-01:
    build: ./pam/srv-01
    volumes:
      - ./pam/srv-01/trusted-user-ca.pem:/etc/ssh/trusted-user-ca.pem:ro
    ports: ["127.0.0.1:2222:22"]
    networks: [lab]
